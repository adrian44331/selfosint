<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Self-OSINT Max – Web OSINT Suite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Self‑OSINT Max</h1>
    <p class="subtitle">Browser-based OSINT report generator (GitHub Pages compatible)</p>
</header>

<section class="input-section">
    <h2>Input</h2>

    <label>Username:</label>
    <input id="username" type="text" placeholder="e.g. johndoe">

    <label>Email:</label>
    <input id="email" type="email" placeholder="e.g. user@example.com">

    <label>Domain:</label>
    <input id="domain" type="text" placeholder="e.g. example.com">

    <label>Websites (comma separated):</label>
    <textarea id="websites" rows="3" placeholder="https://example.com, https://blog.example.com"></textarea>

    <button onclick="runOsint()">Generate report</button>
</section>

<section class="output-section">
    <h2>Report</h2>
    <pre id="output">{ Report has not been generated yet }</pre>
</section>

<footer>
    <p>Self‑OSINT Max • Browser Edition • Static site ready for GitHub Pages</p>
</footer>

<script src="osint.js"></script>
</body>
</html>
